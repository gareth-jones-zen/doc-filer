name: release

# Push a tag such as v1.0.0. A tag with a hyphen (v1.1.0-rc.1) becomes a pre-release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write        # create the release
  id-token: write        # sign the provenance attestation
  attestations: write

# The shared library comes from background-tools-lib, checked out beside this repo as the build expects (see build.yml).
env:
  BACKGROUND_TOOLS_LIB_REF: caf389d4eb95fbadbf08bb6e2c38916cf94f823e   # pinned: a release builds against one known library commit; bump deliberately

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: doc-filer
    steps:
      - uses: actions/checkout@v5
        with:
          path: doc-filer

      - uses: actions/checkout@v5
        with:
          repository: gareth-jones-zen/background-tools-lib
          ref: ${{ env.BACKGROUND_TOOLS_LIB_REF }}
          path: background-tools-lib

      - name: Library commit
        shell: pwsh
        run: git -C ../background-tools-lib log -1 --format='background-tools-lib %H %s'

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: doc-filer/global.json

      - name: Version from the tag
        id: version
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$($version.Contains('-'))" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test -c Release

      - name: Publish (Native AOT, win-x64)
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          dotnet publish src/DocFiler.Console -c Release -r win-x64 -o publish -p:Version=$v
          dotnet publish src/DocFiler.Background -c Release -r win-x64 -o publish -p:Version=$v
          & ./publish/doc-filer.exe --version

      # The zip is the install: both exes, the Lua filters, the stylesheet and pandoc (unpacked from vendor/ by the
      # build, with its licence), and the README. No .pdb files.
      - name: Package
        shell: pwsh
        run: |
          $name = "doc-filer-${{ steps.version.outputs.version }}-win-x64"
          New-Item -ItemType Directory -Path dist, "stage/$name" | Out-Null
          Copy-Item publish/doc-filer.exe, publish/doc-filer-background.exe, README.md "stage/$name/"
          Copy-Item publish/filters, publish/styles, publish/pandoc "stage/$name/" -Recurse
          Compress-Archive -Path "stage/$name/*" -DestinationPath "dist/$name.zip"
          Copy-Item publish/doc-filer.exe, publish/doc-filer-background.exe dist/
          # LF line endings, so `sha256sum -c` works as well as Get-FileHash
          $sums = Get-ChildItem dist -File | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          }
          [IO.File]::WriteAllText("$PWD/dist/SHA256SUMS.txt", (($sums -join "`n") + "`n"))
          Get-Content dist/SHA256SUMS.txt

      - name: Provenance attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            doc-filer/dist/*.zip
            doc-filer/dist/*.exe

      - name: Create the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $flags = @('--generate-notes', '--title', "doc-filer ${{ steps.version.outputs.version }}")
          if ('${{ steps.version.outputs.prerelease }}' -eq 'True') { $flags += '--prerelease' }
          gh release create '${{ github.ref_name }}' dist/*.zip dist/*.exe dist/SHA256SUMS.txt @flags
